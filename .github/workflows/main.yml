name: try-pricer
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: try-pricer
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: remember start time
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: restore memory
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: install
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3 cryptography==43.0.3
      - name: bot
        run: python bot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          LEDGER_KEY: ${{ secrets.LEDGER_KEY }}
      - name: save memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ELAPSED=$(( $(date +%s) - START ))
          if [ "$ELAPSED" -lt 180 ]; then
            echo "Запуск упал быстро ($ELAPSED c) — следующий не запускаю, чтобы не было цикла. Хочешь — смотри лог шага bot."
            exit 0
          fi
          gh workflow run "${{ github.workflow }}" --ref main --repo "${{ github.repository }}"
